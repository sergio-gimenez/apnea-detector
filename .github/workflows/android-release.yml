name: Android release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      - name: Restore signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nocturne-release.jks"

      - name: Build signed APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/nocturne-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew lintRelease assembleRelease
          mv app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/nocturne-${GITHUB_REF_NAME}.apk"
          cd app/build/outputs/apk/release
          sha256sum "nocturne-${GITHUB_REF_NAME}.apk" > "nocturne-${GITHUB_REF_NAME}.apk.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "android/app/build/outputs/apk/release/nocturne-${GITHUB_REF_NAME}.apk" \
            "android/app/build/outputs/apk/release/nocturne-${GITHUB_REF_NAME}.apk.sha256" \
            --title "Nocturne ${GITHUB_REF_NAME}" \
            --generate-notes
