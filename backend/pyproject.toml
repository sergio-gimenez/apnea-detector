[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "apnea-detector-prototype"
version = "0.1.0"
description = "Sleep respiratory-event screening prototype"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.116.1",
  "garminconnect==0.3.11",
  "numpy==2.3.2",
  "python-multipart==0.0.20",
  "sqlalchemy==2.0.43",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==8.4.1",
  "ruff==0.12.11",
]

[project.scripts]
apnea-garmin-login = "apnea_api.garmin:login_cli"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
apnea_api = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
