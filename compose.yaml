services:
  api:
    build: ./backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      APNEA_DATA_DIR: /data
      # Real auth is on by default. Create the operator account once with:
      #   docker compose exec api apnea-admin create-user <username>
      # Set this to 1 only for throwaway local runs with no auth at all.
      APNEA_ALLOW_INSECURE_DEV: ${APNEA_ALLOW_INSECURE_DEV:-0}
      APNEA_TRUSTED_ORIGINS: ${APNEA_TRUSTED_ORIGINS:-}
      APNEA_TRUST_FORWARDED_FOR: ${APNEA_TRUST_FORWARDED_FOR:-0}
    volumes:
      - apnea-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  apnea-data:
    name: apnea-detector-data
